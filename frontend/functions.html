<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/theme.js"></script>
  <title>Events & Celebrations | Sagar Classes</title>
  <link rel="icon" href="images/logo.jpeg">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

  <script src="js/layout.js" data-part="nav"></script>

  <main class="main-content">

    <div class="notice-card sticky-notice">
      <span class="notice-tag"><i class="ri-megaphone-fill"></i> NOTICE</span>
      <div class="ticker"><span class="ticker-text">🎓 Admissions are open for the 2026–27 academic year. Enquire today!</span></div>
    </div>

    <section id="functions" class="view active">
      <div class="section-header-box">
        <div>
          <h2 class="section-title">
            <i class="ri-calendar-schedule-fill tone-orange"></i> Institute Events &amp; Celebrations
          </h2>
          <p class="section-sub">Explore memorable institute events, including annual picnics, farewell celebrations, Sports Day, Holi, and Independence Day programmes.</p>
        </div>
      </div>

      <div class="media-grid" id="functionsDisplayContainer">
      </div>
    </section>
  </main>
</div>

<script src="js/layout.js" data-part="footer"></script>

<script src="js/store.js" defer></script>
<script src="js/script.js" defer></script>
</body>
</html>
