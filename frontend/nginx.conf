server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Static website
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache images / css / js
    location ~* \.(css|js|svg|jpe?g|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Page-view beacon -> backend (only this path; /metrics stays private)
    location = /track/pageview {
        proxy_pass http://backend:3000/track/pageview;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }
}
